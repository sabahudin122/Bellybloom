name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-that-is-not-used-outside-the-test-run
      OPENAI_API_KEY: ""
      AI_RECIPE_GENERATION_ENABLED: "false"
      OPENAI_MODEL: gpt-4o-mini
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: CI-only-password-123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed validation database
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
